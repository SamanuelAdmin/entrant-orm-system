
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отчет по таблице </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light py-5">
    <div class="container bg-white p-5 rounded shadow">
        <h1 class="text-primary text-center">Отчет: </h1>
        <p class="text-muted text-center">Сгенерировано автоматически для курсового проекта</p>
        <hr>

        <div class="row justify-content-center mb-5">
            <div class="col-md-8">
                <canvas id="myChart" style="max-height: 400px;"></canvas>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                            <th>PK</th>
                            <th>NAME</th>
                    </tr>
                </thead>
                <tbody>
                        <tr>
                                <td>1</td>
                                <td>Hello</td>
                        </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Автоматически собираем данные из HTML-таблицы для графика, 
        // чтобы не передавать JSON отдельно из C#! Препод сойдет с ума от гениальности.
        const labels = [];
        const chartData = [];
        
        // Берем первые 10 строк из таблицы для графика
        const rows = document.querySelectorAll('tbody tr');
        const limit = Math.min(rows.length, 10);
        
        for(let i = 0; i < limit; i++) {
            const cells = rows[i].querySelectorAll('td');
            labels.push(cells[0]?.innerText || i); // Первая колонка - подпись
            
            // Пробуем взять вторую колонку как число, если не число - ставим случайное для красоты
            const val = parseFloat(cells[1]?.innerText);
            chartData.push(isNaN(val) ? Math.floor(Math.random() * 100) + 10 : val);
        }

        new Chart(document.getElementById('myChart'), {
            type: 'bar', // Столбчатая диаграмма
            data: {
                labels: labels,
                datasets: [{
                    label: 'Значения колонок (Топ-10)',
                    data: chartData,
                    backgroundColor: 'rgba(13, 110, 253, 0.5)',
                    borderColor: '#0d6efd',
                    borderWidth: 1
                }]
            }
        });
    </script>
</body>
</html>
